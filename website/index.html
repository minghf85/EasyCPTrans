<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyCPTrans - 智能剪贴板管理工具</title>
  <meta name="description" content="EasyCPTrans 是一款强大的剪贴板管理工具，支持文本、图片、文件管理，OCR 文字识别，LLM 翻译等功能。">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            fadeIn: { from: { opacity: '0' }, to: { opacity: '1' } },
          },
          animation: {
            fade: 'fadeIn 0.15s ease-out',
          }
        }
      }
    }
  </script>
  <style>
    .eacp-scroll::-webkit-scrollbar { height: 6px; }
    .eacp-scroll::-webkit-scrollbar-track { background: transparent; }
    .eacp-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .eacp-scroll::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .eacp-scroll-none::-webkit-scrollbar { display: none; }
    .eacp-scroll-none { -ms-overflow-style: none; scrollbar-width: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-tilt { transition: transform 0.15s ease-out; }
    @keyframes slideUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.2s ease-out; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<!-- Landing section (shown before demo) -->
<div id="landingPage" class="w-full max-w-4xl mx-auto">
  <div class="text-center mb-8">
    <div class="inline-flex items-center gap-3 mb-4">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#2563eb"/><path d="M8 12h16M8 16h12M8 20h14" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      <h1 class="text-3xl font-bold text-gray-900">EasyCPTrans</h1>
    </div>
    <p class="text-gray-500 text-lg mb-6" id="landingSubtitle">智能剪贴板，触手可及</p>
    <div class="flex gap-3 justify-center">
      <button onclick="showDemo()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors" id="btnTryDemo">在线体验</button>
      <a href="https://github.com/minghf85/EasyCPTrans/releases" target="_blank" class="border border-gray-300 bg-white text-gray-700 px-6 py-2.5 rounded-lg font-medium hover:bg-gray-50 transition-colors" id="btnDownload">免费下载</a>
      <button onclick="toggleLang()" class="border border-gray-300 bg-white text-gray-600 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors" id="btnLang">EN</button>
    </div>
  </div>
</div>

<!-- App clone (the 1:1 replica) -->
<div id="appClone" class="hidden w-full" style="max-width: 1220px;">
  <div class="relative flex flex-col overflow-hidden rounded-xl border border-gray-200 bg-slate-50 text-gray-900 shadow-2xl" style="height: 520px;">

    <!-- Nav bar -->
    <header class="flex shrink-0 items-center gap-2 border-b border-gray-200 bg-white px-3 py-2">
      <!-- Drag handle -->
      <button class="inline-flex shrink-0 items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-600 h-9 w-9 hover:bg-gray-50 cursor-grab" title="拖拽窗口">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16"/></svg>
      </button>
      <!-- Pin -->
      <button id="btnPin" onclick="togglePin()" class="inline-flex shrink-0 items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-600 h-9 w-9 hover:bg-gray-50 transition-colors" title="置顶窗口">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2v10m0 0l-3-3m3 3l3-3M5 17h14"/></svg>
      </button>
      <!-- Search -->
      <button class="inline-flex shrink-0 items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-600 h-9 w-9 hover:bg-gray-50 transition-colors">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <!-- Search input -->
      <input id="searchInput" type="text" placeholder="搜索..." class="w-40 rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm placeholder:text-gray-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/25 transition-colors" oninput="handleSearch(this.value)">

      <!-- Tabs -->
      <div class="flex items-center gap-0.5 ml-2" id="tabBar">
        <!-- Tabs injected by JS -->
      </div>

      <div class="flex-1"></div>

      <!-- Back to landing -->
      <button onclick="backToLanding()" class="text-xs text-gray-400 hover:text-gray-600 transition-colors px-2 py-1" id="btnBack">← 返回</button>
    </header>

    <!-- Tag selector bar -->
    <div id="tagSelectorBar" class="flex shrink-0 items-center gap-2 px-3 py-1.5 border-b border-gray-100 bg-white overflow-x-auto eacp-scroll-none">
      <!-- Tags injected by JS -->
    </div>

    <!-- Main content area -->
    <div class="flex-1 flex flex-col min-h-0">
      <!-- Card tray -->
      <div id="cardTray" class="eacp-scroll flex-1 flex gap-4 overflow-x-auto overflow-y-hidden rounded-xl bg-slate-100 p-3 m-3 shadow-[inset_0_2px_10px_rgba(15,23,42,0.06)]">
        <!-- Cards injected by JS -->
      </div>
    </div>

    <!-- Status bar -->
    <div class="flex shrink-0 items-center justify-between border-t border-gray-200 bg-white px-4 py-1.5 text-xs text-gray-500">
      <span id="statusCount">6 项</span>
      <span id="statusMemory">内存: 1.2 MB</span>
    </div>
  </div>

  <!-- Feature badges below the app -->
  <div class="mt-6 grid grid-cols-3 gap-4 max-w-2xl mx-auto">
    <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
      <div class="text-2xl mb-1">📋</div>
      <div class="text-sm font-medium text-gray-900" data-i18n="badge.clipboard">智能管理</div>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
      <div class="text-2xl mb-1">🔍</div>
      <div class="text-sm font-medium text-gray-900" data-i18n="badge.ocr">OCR 识别</div>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
      <div class="text-2xl mb-1">🌐</div>
      <div class="text-sm font-medium text-gray-900" data-i18n="badge.translate">LLM 翻译</div>
    </div>
  </div>

  <!-- Download CTA -->
  <div class="mt-8 text-center">
    <a href="https://github.com/minghf85/EasyCPTrans/releases" target="_blank" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors inline-block" id="btnDownload2">下载 Windows 版本</a>
  </div>
</div>

<!-- Context menu -->
<div id="contextMenu" class="hidden fixed z-50 flex items-start gap-1 rounded-xl border border-gray-200 bg-white p-1 shadow-md animate-slide-up" style="min-width: 220px;">
  <div id="contextMenuRoot" class="w-56 space-y-0.5 max-h-[420px] overflow-y-auto eacp-scroll">
    <!-- Items injected by JS -->
  </div>
  <div id="contextMenuSub" class="hidden w-56 space-y-0.5 max-h-[420px] overflow-y-auto eacp-scroll border-l border-gray-200 pl-2">
    <!-- Sub-view injected by JS -->
  </div>
</div>

<script>
// ===== i18n =====
const i18n = {
  zh: {
    subtitle: "智能剪贴板，触手可及",
    tryDemo: "在线体验",
    download: "免费下载",
    back: "← 返回",
    search: "搜索...",
    tabAll: "全部", tabText: "文本", tabImage: "图片", tabFile: "文件", tabPinned: "置顶", tabTags: "标签", tabSettings: "设置",
    tagAll: "全部",
    copy: "复制", paste: "粘贴", pin: "置顶", unpin: "取消置顶", tags: "标签",
    ocr: "OCR 识别", ocrText: "查看识别结果", translate: "翻译", edit: "编辑",
    zoomIn: "放大查看", delete: "删除", private: "私密", unlock: "取消私密",
    translateTo: "翻译为", newTag: "新建标签", addTag: "添加",
    noTags: "暂无标签", cancel: "取消",
    badgeClipboard: "智能管理", badgeOcr: "OCR 识别", badgeTranslate: "LLM 翻译",
    downloadWin: "下载 Windows 版本",
    items: "项", memory: "内存",
    dragHint: "拖拽窗口", pinTitle: "置顶窗口", unpinTitle: "取消置顶",
  },
  en: {
    subtitle: "Smart Clipboard, At Your Fingertips",
    tryDemo: "Try Demo",
    download: "Free Download",
    back: "← Back",
    search: "Search...",
    tabAll: "All", tabText: "Text", tabImage: "Image", tabFile: "File", tabPinned: "Pinned", tabTags: "Tags", tabSettings: "Settings",
    tagAll: "All",
    copy: "Copy", paste: "Paste", pin: "Pin", unpin: "Unpin", tags: "Tags",
    ocr: "OCR Recognize", ocrText: "View Result", translate: "Translate", edit: "Edit",
    zoomIn: "Zoom In", delete: "Delete", private: "Private", unlock: "Unlock",
    translateTo: "Translate to", newTag: "New Tag", addTag: "Add",
    noTags: "No tags", cancel: "Cancel",
    badgeClipboard: "Smart Management", badgeOcr: "OCR Recognition", badgeTranslate: "LLM Translation",
    downloadWin: "Download for Windows",
    items: "items", memory: "Memory",
    dragHint: "Drag window", pinTitle: "Pin on top", unpinTitle: "Unpin",
  }
};

let lang = localStorage.getItem("eacp-lang") || "zh";
const t = (key) => i18n[lang]?.[key] || key;

// ===== Demo data =====
const sampleApps = [
  { name: "VS Code", letter: "V", color: "#007acc" },
  { name: "Chrome", letter: "C", color: "#4285f4" },
  { name: "WeChat", letter: "W", color: "#07c160" },
  { name: "Explorer", letter: "E", color: "#f59e0b" },
  { name: "Terminal", letter: "T", color: "#1f2937" },
  { name: "Figma", letter: "F", color: "#a259ff" },
];

let items = [
  { id: 1, type: "text", content: "https://github.com/minghf85/EasyCPTrans", tags: ["Text", "Link"], pinned: false, app: sampleApps[1], time: Date.now() - 30000, chars: 42 },
  { id: 2, type: "text", content: "EasyCPTrans 是一款智能剪贴板管理工具，支持文本、图片、文件的自动捕获和管理。让剪贴板工作流更高效。", tags: ["Text"], pinned: true, app: sampleApps[0], time: Date.now() - 120000, chars: 52 },
  { id: 3, type: "image", content: "", tags: ["Image"], pinned: false, app: sampleApps[5], time: Date.now() - 180000, ocrText: "EasyCPTrans\n智能剪贴板", width: 800, height: 600 },
  { id: 4, type: "text", content: "const clipboard = await navigator.clipboard.readText();", tags: ["Text"], pinned: false, app: sampleApps[0], time: Date.now() - 240000, chars: 55, code: true },
  { id: 5, type: "text", content: "contact@easycptrans.com", tags: ["Text", "Email"], pinned: false, app: sampleApps[2], time: Date.now() - 300000, chars: 25 },
  { id: 6, type: "file", content: "project-report.pdf", tags: ["File"], pinned: false, app: sampleApps[3], time: Date.now() - 360000, size: "2.4 MB" },
  { id: 7, type: "text", content: "npm install easycptrans@latest", tags: ["Text"], pinned: false, app: sampleApps[4], time: Date.now() - 420000, chars: 31, code: true },
  { id: 8, type: "image", content: "", tags: ["Image"], pinned: false, app: sampleApps[1], time: Date.now() - 500000, width: 1920, height: 1080 },
];

let nextId = 9;
let activeTab = "all";
let activeTag = "all";
let searchQuery = "";
let contextItemId = null;
let contextSubView = null; // null | "tags" | "translate"
let alwaysOnTop = false;

const allTags = ["Text", "Image", "File", "Link", "Email"];
const tabDefs = [
  { key: "all", labelKey: "tabAll", color: "#3b82f6" },
  { key: "text", labelKey: "tabText", color: "#3b82f6" },
  { key: "image", labelKey: "tabImage", color: "#f59e0b" },
  { key: "file", labelKey: "tabFile", color: "#10b981" },
  { key: "pinned", labelKey: "tabPinned", color: "#f59e0b" },
  { key: "tags", labelKey: "tabTags", color: "#8b5cf6" },
  { key: "settings", labelKey: "tabSettings", color: "#6b7280" },
];

function formatTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return lang === "zh" ? "刚刚" : "Just now";
  if (diff < 3600000) return Math.floor(diff / 60000) + (lang === "zh" ? " 分钟前" : "m ago");
  if (diff < 86400000) return Math.floor(diff / 3600000) + (lang === "zh" ? " 小时前" : "h ago");
  return Math.floor(diff / 86400000) + (lang === "zh" ? " 天前" : "d ago");
}

function darkenColor(hex, amount = 0.2) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${Math.round(r * (1 - amount))}, ${Math.round(g * (1 - amount))}, ${Math.round(b * (1 - amount))})`;
}

function getFilteredItems() {
  return items.filter(item => {
    if (activeTab === "text" && item.type !== "text") return false;
    if (activeTab === "image" && item.type !== "image") return false;
    if (activeTab === "file" && item.type !== "file") return false;
    if (activeTab === "pinned" && !item.pinned) return false;
    if (activeTag !== "all" && !item.tags.includes(activeTag)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!item.content.toLowerCase().includes(q) && !item.tags.some(tg => tg.toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return b.time - a.time;
  });
}

function getTypeLabel(type) {
  const map = { text: { zh: "文本", en: "Text" }, image: { zh: "图片", en: "Image" }, file: { zh: "文件", en: "File" } };
  return map[type]?.[lang] || type;
}

function getTypeIcon(type) {
  if (type === "text") return '<svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h14"/></svg>';
  if (type === "image") return '<svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
  return '<svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>';
}

function renderTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = tabDefs.map(tab => {
    const active = activeTab === tab.key;
    return `<button onclick="setTab('${tab.key}')" class="relative inline-flex shrink-0 items-center gap-2 whitespace-nowrap px-3 py-2 text-sm font-medium transition-colors ${active ? 'text-blue-700' : 'text-gray-500 hover:text-gray-900'}">
      <span class="h-2 w-2 shrink-0 rounded-full" style="background-color: ${active ? tab.color : '#9ca3af'}"></span>
      <span>${t(tab.labelKey)}</span>
      ${active ? `<span class="absolute -bottom-2 left-2 right-2 h-0.5 rounded-full bg-blue-600"></span>` : ''}
    </button>`;
  }).join("");
}

function renderTagBar() {
  const bar = document.getElementById("tagSelectorBar");
  const tags = [{ name: "all", label: t("tagAll") }, ...allTags.map(name => ({ name, label: name }))];
  bar.innerHTML = tags.map(tag => {
    const active = activeTag === tag.name;
    return `<button onclick="setTag('${tag.name}')" class="shrink-0 rounded-lg px-2.5 py-1 text-xs font-medium transition-colors ${active ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-gray-50 text-gray-600 border border-gray-200 hover:bg-gray-100'}">#${tag.label}</button>`;
  }).join("");
}

function renderCards() {
  const tray = document.getElementById("cardTray");
  const filtered = getFilteredItems();
  
  if (activeTab === "settings") {
    tray.innerHTML = renderSettingsPage();
    document.getElementById("statusCount").textContent = "";
    return;
  }
  if (activeTab === "tags") {
    tray.innerHTML = renderTagManagementPage();
    document.getElementById("statusCount").textContent = "";
    return;
  }

  document.getElementById("statusCount").textContent = `${filtered.length} ${t("items")}`;

  if (filtered.length === 0) {
    tray.innerHTML = `<div class="flex-1 flex items-center justify-center text-gray-400 text-sm">${lang === "zh" ? "没有匹配的内容" : "No matching items"}</div>`;
    return;
  }

  tray.innerHTML = filtered.map(item => renderCard(item)).join("");
}

function renderCard(item) {
  const bandColor = darkenColor(item.app.color);
  const contentPreview = item.type === "image" 
    ? `<div class="flex-1 flex items-center justify-center bg-gray-50 rounded-lg border border-gray-100" style="min-height: 100px;">
        <svg class="h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
       </div>`
    : item.type === "file"
    ? `<div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg border border-gray-100">
        <svg class="h-8 w-8 text-amber-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
        <div class="min-w-0"><div class="truncate text-sm font-medium text-gray-900">${item.content}</div><div class="text-xs text-gray-500">${item.size || ""}</div></div>
       </div>`
    : `<div class="flex-1 overflow-hidden"><p class="text-sm text-gray-800 leading-relaxed ${item.code ? 'font-mono text-xs bg-gray-50 p-2 rounded-lg' : ''}" style="display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(item.content)}</p></div>`;

  const tagChips = item.tags.map(tag => 
    `<span class="inline-flex shrink-0 items-center gap-0.5 rounded-lg border border-gray-200 bg-gray-50 px-1.5 py-0.5 text-[11px] font-medium text-gray-600">
      <svg class="h-2.5 w-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
      ${tag}
    </span>`
  ).join("");

  return `<div class="flex h-full w-[300px] shrink-0 flex-col overflow-hidden rounded-xl bg-white shadow-[0_12px_28px_rgba(0,0,0,0.12),inset_0_0_0_1px_rgba(255,255,255,0.55)] hover:shadow-[0_16px_34px_rgba(0,0,0,0.15),inset_0_0_0_1px_rgba(255,255,255,0.68)] transition-all duration-200 card-tilt cursor-pointer" oncontextmenu="showContextMenu(event, ${item.id})" onclick="handleCardClick(${item.id})">
    <header class="relative shrink-0 px-4 py-3 pl-[72px] shadow-[inset_0_1px_0_rgba(255,255,255,0.58),0_1px_10px_rgba(20,28,24,0.05)]" style="background-color: ${bandColor}">
      <span class="absolute bottom-0 left-4 z-10 flex h-12 w-12 translate-y-1/3 items-center justify-center rounded-xl bg-white shadow-md">
        <span class="text-base font-semibold" style="color: ${bandColor}">${item.app.letter}</span>
      </span>
      <span class="block truncate text-sm font-semibold text-white">${item.app.name}</span>
      <span class="block truncate text-[11px] leading-4 text-white/70">${getTypeLabel(item.type)}</span>
    </header>
    <div class="flex min-h-0 flex-1 flex-col px-5 pb-4 pt-7">
      ${contentPreview}
      <div class="mt-3 flex shrink-0 items-center gap-1.5 overflow-x-auto eacp-scroll-none border-t border-gray-200 pt-2">
        <span class="inline-flex shrink-0 items-center gap-1 rounded-lg bg-gray-100 px-1.5 py-0.5 text-[11px] font-medium text-gray-600">
          ${getTypeIcon(item.type)} ${getTypeLabel(item.type)}
        </span>
        <span class="inline-flex shrink-0 items-center gap-1 text-[11px] text-gray-500">
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${formatTime(item.time)}
        </span>
        ${item.chars ? `<span class="shrink-0 text-[11px] text-gray-500">${item.chars} chars</span>` : ''}
        ${item.width ? `<span class="shrink-0 text-[11px] text-gray-500">${item.width}×${item.height}</span>` : ''}
        ${item.ocrText ? `<span class="inline-flex shrink-0 items-center gap-0.5 rounded-lg px-1.5 py-0.5 text-[11px] font-medium text-blue-600 bg-blue-50"><svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>${item.ocrText.length}</span>` : ''}
        ${item.pinned ? '<span class="inline-flex shrink-0 items-center gap-0.5 rounded-lg bg-amber-50 px-1.5 py-0.5 text-[11px] font-medium text-amber-700"><svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2v10m0 0l-3-3m3 3l3-3M5 17h14"/></svg>Pinned</span>' : ''}
        ${tagChips}
      </div>
    </div>
  </div>`;
}

function renderSettingsPage() {
  return `<div class="w-full max-w-lg mx-auto p-6 space-y-6">
    <h2 class="text-lg font-semibold text-gray-900">${lang === "zh" ? "设置" : "Settings"}</h2>
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-700">${lang === "zh" ? "语言" : "Language"}</span>
        <select onchange="setLang(this.value)" class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
          <option value="zh" ${lang === "zh" ? "selected" : ""}>中文</option>
          <option value="en" ${lang === "en" ? "selected" : ""}>English</option>
        </select>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-700">${lang === "zh" ? "历史记录上限" : "History Limit"}</span>
        <span class="text-sm text-gray-500">5000</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-700">${lang === "zh" ? "每页显示" : "Page Size"}</span>
        <span class="text-sm text-gray-500">50</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-700">${lang === "zh" ? "OCR 语言" : "OCR Language"}</span>
        <span class="text-sm text-gray-500">${lang === "zh" ? "自动" : "Auto"}</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-700">${lang === "zh" ? "API 翻译" : "API Translation"}</span>
        <span class="inline-flex items-center rounded-lg bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700">${lang === "zh" ? "已启用" : "Enabled"}</span>
      </div>
    </div>
  </div>`;
}

function renderTagManagementPage() {
  return `<div class="w-full max-w-lg mx-auto p-6 space-y-6">
    <h2 class="text-lg font-semibold text-gray-900">${lang === "zh" ? "标签管理" : "Tag Management"}</h2>
    <div class="space-y-2">
      ${allTags.map(tag => `<div class="flex items-center justify-between rounded-lg border border-gray-200 bg-white px-4 py-3">
        <span class="text-sm font-medium text-gray-900">#${tag}</span>
        <span class="text-xs text-gray-500">${items.filter(i => i.tags.includes(tag)).length} ${lang === "zh" ? "项" : "items"}</span>
      </div>`).join("")}
    </div>
  </div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ===== Context menu =====
function showContextMenu(event, itemId) {
  event.preventDefault();
  event.stopPropagation();
  contextItemId = itemId;
  contextSubView = null;
  
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  
  const menu = document.getElementById("contextMenu");
  const root = document.getElementById("contextMenuRoot");
  const sub = document.getElementById("contextMenuSub");
  sub.classList.add("hidden");
  
  const isText = item.type === "text";
  const isImage = item.type === "image";
  
  let menuItems = [
    { key: "paste", icon: "🖱", label: t("paste"), shortcut: "Enter" },
    { key: "copy", icon: "📋", label: t("copy") },
    { sep: true },
    { key: "pin", icon: "📌", label: item.pinned ? t("unpin") : t("pin") },
    { key: "tag", icon: "🏷", label: t("tags"), shortcut: "▸", hasSub: true },
    { sep: true },
  ];
  
  if (isText) {
    menuItems.push({ key: "edit", icon: "✏️", label: t("edit") });
    menuItems.push({ key: "translate", icon: "🌐", label: t("translate"), shortcut: "▸", hasSub: true });
  }
  if (isImage) {
    menuItems.push({ key: "zoom", icon: "🔍", label: t("zoomIn") });
    if (item.ocrText) {
      menuItems.push({ key: "ocr", icon: "📝", label: t("ocrText") });
    } else {
      menuItems.push({ key: "ocr", icon: "📝", label: t("ocr") });
    }
    menuItems.push({ key: "translate", icon: "🌐", label: t("translate"), shortcut: "▸", hasSub: true });
  }
  menuItems.push({ sep: true });
  menuItems.push({ key: "delete", icon: "🗑", label: t("delete"), danger: true, shortcut: "Del" });
  
  root.innerHTML = menuItems.map(mi => {
    if (mi.sep) return '<div class="my-1 border-t border-gray-100"></div>';
    return `<div class="flex w-full cursor-default items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors ${mi.danger ? 'text-red-600 hover:bg-red-50' : ''}" onclick="handleMenuAction('${mi.key}')" ${mi.hasSub ? `onmouseenter="showSubView('${mi.key}', ${itemId})"` : ""}>
      <span class="text-xs">${mi.icon}</span>
      <span class="min-w-0 flex-1 truncate">${mi.label}</span>
      ${mi.shortcut ? `<span class="shrink-0 font-mono text-[10px] text-gray-400">${mi.shortcut}</span>` : ''}
    </div>`;
  }).join("");
  
  menu.classList.remove("hidden");
  menu.style.left = event.clientX + "px";
  menu.style.top = event.clientY + "px";
  
  requestAnimationFrame(() => {
    const rect = menu.getBoundingClientRect();
    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 8) + "px";
    if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 8) + "px";
  });
}

function showSubView(key, itemId) {
  const sub = document.getElementById("contextMenuSub");
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  
  if (key === "tag") {
    sub.innerHTML = `<p class="px-2.5 py-1.5 text-xs font-medium text-gray-500">${t("tags")}</p>` +
      allTags.map(tag => {
        const active = item.tags.includes(tag);
        return `<div class="flex w-full cursor-default items-center gap-2 rounded-lg px-2.5 py-2 text-sm ${active ? 'bg-blue-50 text-blue-700' : 'text-gray-700 hover:bg-gray-100'} transition-colors" onclick="toggleItemTag(${itemId}, '${tag}')">
          ${active ? '<span class="text-blue-600">☑</span>' : '<span class="text-gray-400">☐</span>'}
          <span>#${tag}</span>
        </div>`;
      }).join("");
  } else if (key === "translate") {
    const langs = [
      { label: "中文", value: "zh" }, { label: "English", value: "en" },
      { label: "日本語", value: "ja" }, { label: "한국어", value: "ko" },
      { label: "Français", value: "fr" }, { label: "Deutsch", value: "de" },
      { label: "Español", value: "es" }, { label: "Русский", value: "ru" },
    ];
    sub.innerHTML = `<p class="px-2.5 py-1.5 text-xs font-medium text-gray-500">${t("translateTo")}</p>` +
      langs.map(l => `<div class="flex w-full cursor-default items-center gap-2 rounded-lg px-2.5 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors" onclick="handleTranslate(${itemId}, '${l.value}')">
        <span>🌐</span><span>${l.label}</span>
      </div>`).join("");
  }
  
  sub.classList.remove("hidden");
}

function hideContextMenu() {
  document.getElementById("contextMenu").classList.add("hidden");
  contextItemId = null;
  contextSubView = null;
}

function handleMenuAction(action) {
  if (contextItemId === null) return;
  const item = items.find(i => i.id === contextItemId);
  if (!item) { hideContextMenu(); return; }
  
  switch (action) {
    case "pin": item.pinned = !item.pinned; break;
    case "delete": items = items.filter(i => i.id !== contextItemId); break;
    case "copy":
      if (item.type === "text") navigator.clipboard?.writeText(item.content).catch(() => {});
      break;
  }
  hideContextMenu();
  renderCards();
}

function toggleItemTag(itemId, tag) {
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  if (item.tags.includes(tag)) {
    item.tags = item.tags.filter(t => t !== tag);
  } else {
    item.tags.push(tag);
  }
  showSubView("tag", itemId);
  renderCards();
}

function handleTranslate(itemId, targetLang) {
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  const langNames = { zh: "中文", en: "English", ja: "日本語", ko: "한국어", fr: "Français", de: "Deutsch", es: "Español", ru: "Русский" };
  hideContextMenu();
  alert(`${lang === "zh" ? "翻译为" : "Translate to"} ${langNames[targetLang]}:\n\n[${lang === "zh" ? "模拟翻译结果" : "Simulated translation"}] ${item.content.slice(0, 50)}...`);
}

function handleCardClick(itemId) {
  const card = document.querySelector(`[oncontextmenu*="${itemId}"]`);
  if (card) {
    card.style.boxShadow = "0 16px 40px rgba(37,99,235,0.35), inset 0 0 0 2px rgba(37,99,235,0.50)";
    setTimeout(() => {
      card.style.boxShadow = "";
    }, 400);
  }
}

// ===== Actions =====
function setTab(key) { activeTab = key; renderTabs(); renderCards(); }
function setTag(tag) { activeTag = tag; renderTagBar(); renderCards(); }
function handleSearch(q) { searchQuery = q; renderCards(); }
function togglePin() {
  alwaysOnTop = !alwaysOnTop;
  const btn = document.getElementById("btnPin");
  btn.className = alwaysOnTop
    ? "inline-flex shrink-0 items-center justify-center rounded-lg bg-blue-600 text-white h-9 w-9 hover:bg-blue-700 transition-colors"
    : "inline-flex shrink-0 items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-600 h-9 w-9 hover:bg-gray-50 transition-colors";
}

function showDemo() {
  document.getElementById("landingPage").classList.add("hidden");
  document.getElementById("appClone").classList.remove("hidden");
  renderTabs();
  renderTagBar();
  renderCards();
}

function backToLanding() {
  document.getElementById("appClone").classList.add("hidden");
  document.getElementById("landingPage").classList.remove("hidden");
}

function setLang(l) {
  lang = l;
  localStorage.setItem("eacp-lang", l);
  applyLang();
}

function toggleLang() {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("eacp-lang", lang);
  applyLang();
}

function applyLang() {
  document.getElementById("landingSubtitle").textContent = t("subtitle");
  document.getElementById("btnTryDemo").textContent = t("tryDemo");
  document.getElementById("btnDownload").textContent = t("download");
  document.getElementById("btnLang").textContent = lang === "zh" ? "EN" : "中文";
  document.getElementById("btnBack").textContent = t("back");
  document.getElementById("searchInput").placeholder = t("search");
  document.getElementById("btnDownload2").textContent = t("downloadWin");
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute("data-i18n");
    const map = { "badge.clipboard": "badgeClipboard", "badge.ocr": "badgeOcr", "badge.translate": "badgeTranslate" };
    if (map[key]) el.textContent = t(map[key]);
  });
  renderTabs();
  renderTagBar();
  renderCards();
}

// ===== Init =====
document.addEventListener("DOMContentLoaded", () => {
  applyLang();
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#contextMenu")) hideContextMenu();
  });
});
</script>
</body>
