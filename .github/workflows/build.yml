name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same ref supersedes the build still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit tests
        run: pnpm test

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build app and installers
        run: pnpm tauri build

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" installers/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" installers/ -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem installers)) {
            throw "Tauri produced no installer - check bundle.targets in src-tauri/tauri.conf.json"
          }
          Get-ChildItem installers | Format-Table Name, Length

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: EasyCPTrans-installers
          path: installers/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the release notes need the full history to find the previous tag
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"

          stale=""
          [ "$conf" = "$tag" ] || stale="$stale src-tauri/tauri.conf.json($conf)"
          [ "$pkg" = "$tag" ] || stale="$stale package.json($pkg)"
          [ "$cargo" = "$tag" ] || stale="$stale src-tauri/Cargo.toml($cargo)"

          if [ -n "$stale" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version. Bump and commit first:$stale"
            exit 1
          fi
          echo "Releasing EasyCPTrans $tag"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: EasyCPTrans-installers
          path: installers

      - name: Generate release notes
        env:
          INSTALLER_DIR: installers
        run: |
          bash .github/scripts/release-notes.sh > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="EasyCPTrans $GITHUB_REF_NAME"
          flags=()
          # a version like v0.2.0-rc.1 is not a stable release
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file notes.md \
              "${flags[@]}" \
              installers/*
          fi
